name: Auto SEO Content Cron

on:
  schedule:
    # Tuesday & Friday 06:00 UTC
    - cron: "0 6 * * 2,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-content-cron
  cancel-in-progress: false

jobs:
  generate-post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate SEO blog post
        env:
          # OpenAI/Groq öncelikli (Gemini free-tier 404/429 kırılgan)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_CONTENT_MODEL: ${{ vars.OPENAI_CONTENT_MODEL }}
          # Boş bırak veya gemini-flash-latest — gemini-2.5-flash yeni kullanıcılara kapalı
          GEMINI_CONTENT_MODEL: ${{ vars.GEMINI_CONTENT_MODEL || 'gemini-flash-latest' }}
          NEXT_PUBLIC_SITE_URL: https://tryclause.tech
        run: npm run content:generate

      - name: Commit and push MDX
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "content(blog): auto-generate SEO legal guide"
          file_pattern: "src/content/blog/*.mdx scripts/data/content-engine-state.json"
          commit_user_name: clause-content-bot
          commit_user_email: content-bot@tryclause.tech
